# Synod v3.0 Benchmark Configuration
version: "1.0.0"

# Model Configuration (v3.8: current direct-API roster — was the pre-cutover
# gpt-4o / claude-sonnet-4 / gemini-2.0-flash set until 2026-07)
models:
  claude: "claude-sonnet-5"
  gemini: "gemini-3.1-pro-preview"
  openai:
    primary: "gpt-5.6-sol"
    expensive: "gpt-5.6-sol"  # xhigh reasoning; former o3 slot

# Benchmark Settings
benchmarks:
  gsm8k:
    enabled: true
    sample_size: 300  # Phase 1
    seed: 42

  truthfulqa:
    enabled: false  # Phase 2
    sample_size: 300
    mode: "mc1"  # mc1 or mc2

# Cost Settings
cost:
  estimated_per_question: 0.25  # USD
  budget_limit: 100  # USD for Phase 1

# Execution Settings
execution:
  parallel_workers: 1  # Sequential for rate limits
  retry_attempts: 3
  timeout_seconds: 300
  delay_between_requests: 2  # seconds

# Output Settings
output:
  save_raw_responses: true
  save_parsed_answers: true
  generate_report: true

# Synod Settings
synod:
  mode: "general"  # review/design/debug/general

# Baselines to run
baselines:
  claude_only: true
  openai_only: true
  majority_vote: true
  self_consistency: false  # Expensive
