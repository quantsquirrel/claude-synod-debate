name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinned: an unpinned ruff silently changes what "formatted" means and
        # fails unrelated PRs. 0.16 additionally formats Python code blocks inside
        # Markdown, which this repo has not been through yet — adopting it is a
        # separate, repo-wide formatting pass.
        pip install 'ruff==0.15.12'

    - name: Run ruff check
      run: |
        ruff check .

    - name: Run ruff format check
      run: |
        ruff format --check .
